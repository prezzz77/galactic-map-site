<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="從星系、天體分類到行星，一起用可靠的科學資料探索宇宙。"
    />
    <meta name="theme-color" content="#070b17" />
    <title>宇宙漫遊 — 從這裡開始探索</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="script.js"></script>
  </head>
  <body>
    <div class="space-backdrop" aria-hidden="true">
      <div class="space-glow"></div>
      <div class="space-stars"></div>
    </div>

    <header class="site-header">
      <a class="brand" href="index.html" aria-label="宇宙漫遊首頁">
        <span class="brand-mark" aria-hidden="true">✦</span>
        <span>宇宙漫遊</span>
      </a>
      <span class="header-note">一段從星系開始的科學旅程</span>
    </header>

    <main class="home-main">
      <section class="home-hero" aria-labelledby="home-title">
        <p class="eyebrow"><span class="eyebrow-line"></span> COSMIC EXPLORER</p>
        <h1 id="home-title">從一片星海，<span>開始探索。</span></h1>
        <p class="hero-copy">
          選擇一個星系，循著分類與天體，一步步靠近我們所知道的宇宙。
        </p>
        <a class="start-cue" href="#galaxy-grid">
          <span class="start-cue-icon" aria-hidden="true">↓</span>
          <span>選擇星系開始探索</span>
        </a>
      </section>

      <section class="map-section" aria-labelledby="universe-map-heading">
        <div class="section-heading">
          <div>
            <p class="eyebrow">INTERACTIVE STAR MAP</p>
            <h2 id="universe-map-heading">在星圖中選擇目的地</h2>
          </div>
          <p class="section-hint">點選星系標記，直接切換至該星系頁面</p>
        </div>
        <div class="map-layout">
          <div id="universe-map" class="map-host" aria-label="可互動星系星圖"></div>
          <aside id="galaxy-focus" class="map-focus" aria-live="polite">
            <p class="eyebrow">DESTINATION PREVIEW</p>
            <h3>預覽星系</h3>
            <p>點選星系標記即可進入該星系的探索頁面。</p>
          </aside>
        </div>
      </section>

      <section class="galaxy-section" id="galaxy-grid" aria-labelledby="galaxy-heading">
        <div class="section-heading">
          <div>
            <p class="eyebrow">GALAXY DIRECTORY</p>
            <h2 id="galaxy-heading">星系目錄</h2>
          </div>
          <p class="section-hint">也可以從目錄直接進入</p>
        </div>
        <div id="galaxy-cards" class="galaxy-grid" aria-live="polite">
          <p class="loading-message">正在整理星圖…</p>
        </div>
      </section>

      <p class="home-footnote">
        內容以已知天文觀測為基礎；數值會因測量方式與新發現而更新。
      </p>
    </main>
  </body>
</html>
